name: Virtual Lab tests
on:
  push:
    paths:
      - 'virtual-lab/**'
      - '.github/workflows/virtual-lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test virtual-lab/engine.test.mjs
